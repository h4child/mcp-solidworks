name: CI

# Runs the contract/regression suite and the linter on every push and pull
# request. None of this needs SolidWorks or even Windows: tests/conftest.py
# fakes win32com/pythoncom on any OS where the real pywin32 is not
# importable, so the ubuntu job gives the fast, free, primary signal, and
# the windows job additionally confirms the server still *imports* cleanly
# against the real pywin32 (no SolidWorks install required for that either --
# see server.py's _connect(), which raises a clean error when nothing is
# running instead of hanging).
on:
  # Every branch, not just main: work branches used to merge in red because
  # nothing ran on them until after the merge.
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      # The tool catalog is sent to the model on every conversation. The
      # budget starts at the v5.22.0 size and is lowered as descriptions are
      # trimmed (PLANO_DE_MELHORIA_MCP.txt, phase 3) -- it only goes down.
      - name: Tool catalog context budget
        run: uv run python scripts/measure_catalog.py --max-tokens 60000

      - name: Build ChatGPT plugin
        run: uv run python scripts/build_chatgpt_plugin.py --zip
